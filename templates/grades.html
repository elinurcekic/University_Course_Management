{% extends "base.html" %}{% block content %}<h2>Grades</h2><form method="post"><label>Enrollment<select name="enrollment_id" required>{% for e in eligible %}<option value="{{ e.enrollment_id }}">{{ e.student_number }} — {{ e.student_name }} · {{ e.course_code }} / {{ e.section_number }}</option>{% endfor %}</select></label><label>Assessment<input name="assessment_name" required></label><label>Score<input type="number" name="score" min="0" step="0.01" required></label><label>Maximum score<input type="number" name="max_score" min="0.01" step="0.01" value="100" required></label><button type="submit">Save grade</button></form><table><tr><th>Student</th><th>Course</th><th>Assessment</th><th>Score</th><th>Maximum</th></tr>{% for g in grades %}<tr><td>{{ g.student_number }} — {{ g.student_name }}</td><td>{{ g.course_code }}</td><td>{{ g.assessment_name }}</td><td>{{ g.score }}</td><td>{{ g.max_score }}</td></tr>{% endfor %}</table>{% endblock %}
