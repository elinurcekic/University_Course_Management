{% extends "base.html" %}{% block content %}<h2>Enrollments</h2><form method="post"><label>Student<select name="student_id" required>{% for s in students %}<option value="{{ s.student_id }}">{{ s.student_number }} — {{ s.full_name }}</option>{% endfor %}</select></label><label>Section<select name="section_id" required>{% for s in sections %}<option value="{{ s.section_id }}">{{ s.label }}</option>{% endfor %}</select></label><button type="submit">Register</button></form><table><tr><th>Student</th><th>Name</th><th>Course</th><th>Section</th><th>Status</th><th>Date</th></tr>{% for e in enrollments %}<tr><td>{{ e.student_number }}</td><td>{{ e.student_name }}</td><td>{{ e.course_code }}</td><td>{{ e.section_number }}</td><td>{{ e.status }}</td><td>{{ e.enrollment_date }}</td></tr>{% endfor %}</table>{% endblock %}
