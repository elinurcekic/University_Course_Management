{% extends "base.html" %}{% block content %}<h2>Students</h2><form method="get"><input name="q" value="{{ q }}" placeholder="Search name, number or email"><button>Search</button></form><table><tr><th>Number</th><th>Name</th><th>Email</th><th>Department</th><th>Program</th><th>Level</th><th>Status</th></tr>{% for s in students %}<tr><td>{{ s.student_number }}</td><td>{{ s.first_name }} {{ s.last_name }}</td><td>{{ s.email }}</td><td>{{ s.department_name }}</td><td>{{ s.program }}</td><td>{{ s.level }}</td><td>{{ s.status }}</td></tr>{% endfor %}</table>{% endblock %}
